# Publishes to npm when a version tag (v*) is pushed. Uses npm trusted
# publishing (OIDC) with provenance, so no NPM_TOKEN secret is stored here:
# link this repository and workflow file as a trusted publisher on npmjs.com
# before the first release.
name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
